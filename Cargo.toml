[package]
name = "sans_dict"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "macros",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
vidyut-lipi = "0.2"
lipilekhika = "1.1.2"
regex = "1"
flate2 = "1"
ammonia = "4"
unicode-normalization = "0.1"
sha2 = "0.10"
futures-util = "0.3"
anyhow = "1"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "import"
path = "src/bin/import.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
