[package]
name = "sans_dict"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "postgres-array",
] }
# The sqlx that SeaORM runs on; used directly only for bulk COPY in the importer.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "macros",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "macros"] }
utoipa-axum = "0.2"
vidyut-lipi = "0.2"
lipilekhika = "1.1.2"
regex = "1"
flate2 = "1"
ammonia = "4"
unicode-normalization = "0.1"
sha2 = "0.10"
futures-util = "0.3"
anyhow = "1"
tower = "0.5"
vercel_runtime = { version = "2", features = ["axum"] }

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "vercel"
path = "api/vercel.rs"

[[bin]]
name = "import"
path = "src/bin/import.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
