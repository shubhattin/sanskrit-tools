[package]
name = "vidyut-test"
version = "0.1.0"
edition = "2024"
publish = false

# All vidyut crates are pinned to ONE git revision of github.com/ambuda-org/vidyut.
# Why git and not crates.io: `vidyut-cheda`, `vidyut-sandhi` and `vidyut-akshara` are not
# published, and cheda's types (kosha::PadaEntry, prakriya::args::*) only line up if every
# crate comes from the same source. Data in `data/` (py-0.4.0 release) matches this rev
# (vidyut-kosha has not changed since py-0.4.0).
[dependencies]
vidyut-akshara  = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
vidyut-chandas  = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
vidyut-cheda    = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
vidyut-kosha    = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
vidyut-lipi     = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
vidyut-prakriya = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
vidyut-sandhi   = { git = "https://github.com/ambuda-org/vidyut.git", rev = "8da2f90bee3ce1c07505fa432fc3729e3f7e02ea" }
lipilekhika = "1.1.2"

# vidyut-prakriya does heavy rule application; debug builds are very slow for it.
# debug-assertions=false also stops prakriya from inserting internal debug lines
# (rule code "    ") into `Prakriya::history()`.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

